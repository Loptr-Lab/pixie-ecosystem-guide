name: PIXIE Companion review checks

on:
  pull_request:
    paths:
      - 'apps/companion/**'
      - '.github/workflows/companion-ci.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: companion-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Companion tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Requirements are enforced by behavioral tests, not text matching.
      - name: Read binding project instructions
        run: |
          test -s ../../AGENTS.md
          cat ../../AGENTS.md
      - name: Enable repository-pinned pnpm
        run: corepack enable
      - name: Install exact lockfile dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: corepack pnpm test
      - name: Type check
        run: corepack pnpm run typecheck
      - name: Build static Companion
        run: corepack pnpm run build
      - name: Confirm generated entrypoint
        run: test -s tangled-site/index.html
      # Reuse the two reviewed journeys against a fixed Creator OS source tree.
      - name: Check out reviewed Creator OS browser fixture
        uses: actions/checkout@v4
        with:
          repository: ibloud/pixie-creator-os
          ref: 9358a26f97f6012e3107dd61ae96075ea1889569
          path: .ci-creator
          persist-credentials: false
      - name: Prepare existing browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pixie-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/pixie-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PIXIE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pixie-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PIXIE_CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/pixie-browser/node_modules/playwright")" >> "$GITHUB_ENV"
      - name: Verify private workspace and helper browser journey
        run: node tests/browser-owner.cjs
      - name: Verify paired Creator OS browser journey
        env:
          PIXIE_CREATOR_ROOT: ${{ github.workspace }}/.ci-creator
        run: node tests/browser-creator.cjs

  existing-guide:
    name: Preserve existing guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
